[package]
name = "dlrs"
version = "1.0.1"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.38"
clap = { version = "4.6.5", features = ["derive"] }
colored = "3.1.1"
futures = "0.3.33"
indicatif = "0.18.6"
regex = "1.13.1"
reqwest = { version = "0.13.4", features = ["rustls"] }
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = { version = "0.7.19", features = ["full"] }
url = "2.5.8"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["signal"] }